# DRAFT, not live. The build reads ../../nginx.conf. To adopt: copy this file over the root nginx.conf.
# Ends of the Earth: static site behind the cluster ingress (TLS ends at the ingress).
# Source: review docs/review-2026-11-09.md, M4 and m3. 2026-11-09.

# One Cache-Control per response, chosen from path and query. It is kept at server level
# because an add_header inside a location drops every server-level add_header (nginx rule).
# The regexes are tried in order and the first match wins.
map "$uri|$args" $cache_control {
    # Pages and share pages: always revalidate, so a release or a domain move shows at once.
    "~^[^|]*\.html\|"                                   "no-cache";
    # Assets the build stamps with ?v=<hash> (index.html links and every module import).
    "~\|(.*&)?v=[0-9a-f]+(&|$)"                         "public, max-age=31536000, immutable";
    # Decks, map data, config: the app fetches these with cache: 'no-cache' anyway; the ETag keeps it cheap.
    "~^/(data/|config\.json)"                           "no-cache";
    # Unstamped static files: images, share cards, fonts, sound.
    "~\.(png|jpe?g|webp|svg|ico|ttf|woff2?|m4a|mp3)\|"  "public, max-age=86400";
    default                                             "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml font/ttf;

    add_header Cache-Control $cache_control always;

    # Security headers. "always" means 404s carry them too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # The CSP starts as Report-Only. Watch the browser console on staging for violations, then
    # rename the header to Content-Security-Policy. What it allows, and why:
    #   script-src sha256 = the one inline script in every s/*.html page: location.replace('../');
    #   img-src goatcounter = count.js pings https://<code>.goatcounter.com (the code is in config.json)
    #   worker-src blob: = MapLibre 4.7 starts its worker from a blob URL
    #   img data:/blob: = canvas share cards and object URLs
    # If the goatcounter code or the share-page script changes, update this header.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-BSa1ZA1hUPwGQoHBTHOtdB3it9+cqP66kGrOa5iThFo='; style-src 'self'; img-src 'self' data: blob: https://jepsjaunts.goatcounter.com; connect-src 'self'; worker-src blob:; child-src blob:; font-src 'self'; media-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    # HSTS: turn it on only once the final domain serves HTTPS reliably. Browsers cache it, so it is hard to undo.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location ~* \.(js|css|ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|map|webp|json|m4a|mp3|pbf)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
